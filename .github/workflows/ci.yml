name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect runner user
        # The image's dev user must match the workspace owner on the runner,
        # otherwise dev cannot write into the mounted repository
        id: usr
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # Using type=gha caching specifically for GitHub Actions environments to speed up multi-job workflows
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: tvl-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            UID=${{ steps.usr.outputs.uid }}
            GID=${{ steps.usr.outputs.gid }}

      - name: Build in Docker
        run: |
          docker run --rm --user dev -v ${{ github.workspace }}:/app -w /app tvl-env /bin/bash -c "
            java -jar \$ANTLR_JAR -visitor -no-listener -Dlanguage=Java ./src/main/scala/Grammar/TVL.g4 &&
            sbt compile
          "
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect runner user
        # The image's dev user must match the workspace owner on the runner,
        # otherwise dev cannot write into the mounted repository
        id: usr
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # Leveraging the type=gha cache populated in the previous build step
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: tvl-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            UID=${{ steps.usr.outputs.uid }}
            GID=${{ steps.usr.outputs.gid }}

      - name: Test target generation in Docker
        run: |
          docker run --rm --user dev -v ${{ github.workspace }}:/app -w /app tvl-env /bin/bash -c "
            java -jar \$ANTLR_JAR -visitor -no-listener -Dlanguage=Java ./src/main/scala/Grammar/TVL.g4 &&
            sbt target:test
          "
      - name: Test integration correctness in Docker
        run: |
          docker run --rm --user dev -v ${{ github.workspace }}:/app -w /app tvl-env /bin/bash -c "
            java -jar \$ANTLR_JAR -visitor -no-listener -Dlanguage=Java ./src/main/scala/Grammar/TVL.g4 &&
            sbt correctness:test
          "
      - name: Test unit IR generation in Docker
        run: |
          docker run --rm --user dev -v ${{ github.workspace }}:/app -w /app tvl-env /bin/bash -c "
            java -jar \$ANTLR_JAR -visitor -no-listener -Dlanguage=Java ./src/main/scala/Grammar/TVL.g4 &&
            sbt unit:test
          "
