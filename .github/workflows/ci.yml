name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: tvl-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app tvl-env /bin/bash -c "
            java -jar \$ANTLR_JAR -visitor -no-listener -Dlanguage=Java ./src/main/scala/Grammar/TVL.g4 &&
            sbt compile
          "
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: tvl-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app tvl-env /bin/bash -c "
            java -jar \$ANTLR_JAR -visitor -no-listener -Dlanguage=Java ./src/main/scala/Grammar/TVL.g4 &&
            sbt test
          "
